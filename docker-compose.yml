services:
  crate-excavator:
    build:
      context: .
      args:
        # Must match the owner of ./data on the host (see Dockerfile).
        APP_UID: ${APP_UID:-1000}
    image: crate-excavator:latest
    container_name: crate-excavator
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - PLEX_URL=http://host.docker.internal:32400
      - TAUTULLI_URL=http://host.docker.internal:8181
      - LIDARR_URL=http://host.docker.internal:8686
      - DEEMIX_URL=http://host.docker.internal:6595
      - OLLAMA_URL=http://host.docker.internal:11434
      - DATA_DIR=/app/data
      # Scheduler times (the *_CRON settings) use this time zone. Set TZ in .env, e.g. TZ=America/Chicago.
      - TZ=${TZ:-UTC}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
